name: FinCasa v9 validation
on:
  push:
    branches: [feature/fincasa-v9-contas-mobile]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check features-v9.js
      - run: node --test test/v9.test.cjs
      - run: node --test test/static.test.cjs
      - run: node --test test/pwa.test.cjs
